name: Build Saint-Victor (Android et iPhone)
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verifier la configuration
        run: |
          if grep -q "COLLEZ_ICI" lib/config.dart; then echo "ERREUR : le fichier lib/config.dart n'est pas rempli (adresse et cle Supabase)."; exit 1; fi
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter create . --platforms=android --project-name santelab --org cm.stvictor
      - name: Permissions et nom de l'application
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n    <application#' android/app/src/main/AndroidManifest.xml
          sed -i 's#android:label="[^"]*"#android:label="Saint-Victor"#' android/app/src/main/AndroidManifest.xml
      - name: Cle de signature (coffre GitHub)
        env:
          KS: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KS" ]; then echo "ERREUR : le secret KEYSTORE_B64 est absent. Ouvrez Settings > Secrets and variables > Actions et creez-le."; exit 1; fi
          mkdir -p ~/.android
          echo "$KS" | base64 -d > ~/.android/debug.keystore
      - run: flutter pub get
      - name: Icone de l'application
        continue-on-error: true
        run: dart run flutter_launcher_icons
      - name: Adresse du depot (mises a jour dans l'application)
        run: sed -i "s#REPO_AUTO#${{ github.repository }}#" lib/config.dart
      - run: flutter build apk --release --build-number=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: SaintVictor-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
      - name: Publier la mise a jour (lien permanent de telechargement)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          B=$(grep -o 'kBuild = [0-9]*' lib/config.dart | grep -o '[0-9]*$')
          cp build/app/outputs/flutter-apk/app-release.apk SaintVictor.apk
          echo "$B" > version.txt
          gh release delete latest --cleanup-tag -y || true
          gh release create latest SaintVictor.apk version.txt --title "Saint-Victor version $B" --notes "Version $B de l'application" --latest
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verifier la configuration
        run: |
          if grep -q "COLLEZ_ICI" lib/config.dart; then echo "ERREUR : le fichier lib/config.dart n'est pas rempli."; exit 1; fi
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter create . --platforms=web --project-name santelab --org cm.stvictor
      - name: Nom de la version web
        run: sed -i 's/santelab/Saint-Victor/g' web/index.html web/manifest.json
      - run: flutter pub get
      - name: Icones de la version web
        continue-on-error: true
        run: |
          cat > icons_web.yaml <<'EOT'
          flutter_launcher_icons:
            web:
              generate: true
              image_path: "assets/icon.png"
              background_color: "#FFFFFF"
              theme_color: "#123C80"
          EOT
          dart run flutter_launcher_icons -f icons_web.yaml
      - run: flutter build web --release --base-href "/${{ github.event.repository.name }}/" --no-web-resources-cdn
      - uses: actions/upload-artifact@v4
        with:
          name: SaintVictor-Web-iPhone
          path: build/web
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
  deploy-web:
    needs: web
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  deploy-firebase:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter create . --platforms=web --project-name santelab --org cm.stvictor
      - name: Nom de la version web
        run: sed -i 's/santelab/Saint-Victor/g' web/index.html web/manifest.json
      - run: flutter pub get
      - name: Icones de la version web
        continue-on-error: true
        run: |
          cat > icons_web.yaml <<'EOT'
          flutter_launcher_icons:
            web:
              generate: true
              image_path: "assets/icon.png"
              background_color: "#FFFFFF"
              theme_color: "#123C80"
          EOT
          dart run flutter_launcher_icons -f icons_web.yaml
      - run: flutter build web --release --base-href "/" --no-web-resources-cdn
      - name: Configuration Firebase Hosting
        run: |
          cat > firebase.json <<'EOT'
          {"hosting":{"public":"build/web","ignore":["firebase.json","**/.*","**/node_modules/**"],"rewrites":[{"source":"**","destination":"/index.html"}]}}
          EOT
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: saint-victor-bafia-9e5da
          channelId: live
