
name: Build Apk st Victor

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Préparer Android
        run: |
          flutter create --platforms=android --project-name santelab --org cm.stvictor .
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          permissions = [
              '  <uses-permission android:name="android.permission.INTERNET"/>',
              '  <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>',
          ]

          for permission in permissions:
              if permission not in s:
                  s = s.replace(
                      '<application',
                      permission + '\n  <application',
                      1
                  )

          s = s.replace(
              'android:label="Flutter"',
              'android:label="St Victor Bafia"'
          )

          p.write_text(s)
          PY

      - name: Installer les dépendances
        run: flutter pub get

      - name: Générer l'icône
        continue-on-error: true
        run: dart run flutter_launcher_icons

      - name: Construire l'APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build apk --release \
            --dart-define="SUPABASE_URL=$SUPABASE_URL" \
            --dart-define="SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"

      - name: Télécharger l'APK
        uses: actions/upload-artifact@v4
        with:
          name: StVictor-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
