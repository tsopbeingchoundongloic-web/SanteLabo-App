name: santelab
description: Application du Centre Saint-Victor de Bafia
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.3.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.0
  url_launcher: ^6.3.0
  geolocator: ^13.0.2
  http: ^1.2.0
  shared_preferences: ^2.3.0
  image_picker: ^1.1.2
dev_dependencies:
  flutter_launcher_icons: ^0.14.3
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon.png
flutter:
  uses-material-design: true
  assets:
    - assets/
